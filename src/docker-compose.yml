name: homesecurity

services:
  postgres-keycloak:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_KEYCLOAK_DB}
      POSTGRES_USER: ${POSTGRES_KEYCLOAK_USER}
      POSTGRES_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ images expect a single mount at /var/lib/postgresql
      # (data lands in a version-specific subdirectory), not .../data.
      - postgres_keycloak_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  postgres-app:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_APP_DB}
      POSTGRES_USER: ${POSTGRES_APP_USER}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_app_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  keycloak:
    image: keycloak/keycloak:26.7.4
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/${POSTGRES_KEYCLOAK_DB}
      KC_DB_USERNAME: ${POSTGRES_KEYCLOAK_USER}
      KC_DB_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./config/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    healthcheck:
      # No curl/wget in this image; health is served on the management
      # port (9000), so probe it via bash's /dev/tcp instead.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - backend

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4-alpine
    command:
      - --provider=keycloak-oidc
      - --oidc-issuer-url=http://keycloak:8080/realms/home-security
      - --client-id=oauth2-proxy
      - --client-secret=${OAUTH2_PROXY_CLIENT_SECRET}
      - --cookie-secret=${OAUTH2_PROXY_COOKIE_SECRET}
      - --redirect-url=http://localhost:4180/oauth2/callback
      - --email-domain=*
      - --http-address=0.0.0.0:4180
      # Stands in for the Admin UI, which doesn't exist yet: returns a
      # bare 200 once the OIDC login succeeds. Swap this for the real
      # upstream once the Admin UI service is built.
      - --upstream=static://200
      - --cookie-secure=false
    ports:
      - "4180:4180"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "4180"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:8.10.1-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  org-service:
    build:
      context: ..
      dockerfile: src/dotnet/Org/Dzaba.HomeSecurity.Org.Service/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      # No TLS termination in front of this service in the local stack -
      # see the comment on Security:UseHttpsRedirection in Program.cs.
      Security__UseHttpsRedirection: "false"
      ConnectionStrings__AppDatabase: Host=postgres-app;Port=5432;Database=${POSTGRES_APP_DB};Username=${POSTGRES_APP_USER};Password=${POSTGRES_APP_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      ConnectionStrings__RabbitMQ: host=rabbitmq;username=${RABBITMQ_DEFAULT_USER};password=${RABBITMQ_DEFAULT_PASS}
      # appsettings.Development.json points this at localhost:8080 (for
      # running the app bare on the host); that's unreachable from inside
      # this container's network, so it's overridden back to the in-network
      # hostname the base appsettings.json already uses.
      Authentication__Keycloak__Authority: http://keycloak:8080/realms/home-security
    ports:
      - "8082:8080"
    depends_on:
      postgres-app:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

  logs-ingestion-service:
    build:
      context: ..
      dockerfile: src/dotnet/LogsIngestion/Dzaba.HomeSecurity.LogsIngestion.Service/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      # No TLS termination in front of this service in the local stack -
      # see the comment on Security:UseHttpsRedirection in Program.cs.
      Security__UseHttpsRedirection: "false"
      ConnectionStrings__RabbitMQ: host=rabbitmq;username=${RABBITMQ_DEFAULT_USER};password=${RABBITMQ_DEFAULT_PASS}
      Authentication__DeviceTokens__SigningKey: ${LOGS_DEVICE_TOKENS_SIGNING_KEY}
    ports:
      - "8083:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

  adminer:
    image: adminer:6.0.1
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    volumes:
      - ./config/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    # No healthcheck: this image is distroless (no shell, no wget/curl), so
    # none of this stack's usual healthcheck styles apply, and `validate
    # --config=...` only checks config syntax, not that the process is
    # actually up and receiving data.
    depends_on:
      - tempo
    networks:
      - backend

  prometheus:
    image: prom/prometheus:v3.14.0
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  loki:
    image: grafana/loki:3.7.8
    volumes:
      - ./config/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - backend

  tempo:
    image: grafana/tempo:3.0.3
    # The image's entrypoint takes no default args/config path - it must be
    # passed explicitly or Tempo starts with an empty config (and fails with
    # "unknown backend").
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./config/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
    # No healthcheck: this image has no shell, no wget/curl, and no
    # built-in healthcheck subcommand.
    networks:
      - backend

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./config/grafana/provisioning/datasources/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

networks:
  backend:

volumes:
  postgres_keycloak_data:
  postgres_app_data:
  rabbitmq_data:
  redis_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
