name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  org-service:
    name: Org service
    uses: ./.github/workflows/dotnet-service-ci.yml
    with:
      service-name: org-service
      solution-path: src/dotnet/Org/Dzaba.HomeSecurity.Org.slnx
      dockerfile-path: src/dotnet/Org/Dzaba.HomeSecurity.Org.Service/Dockerfile

  logs-ingestion-service:
    name: Logs Ingestion service
    uses: ./.github/workflows/dotnet-service-ci.yml
    with:
      service-name: logs-ingestion-service
      solution-path: src/dotnet/LogsIngestion/Dzaba.HomeSecurity.LogsIngestion.slnx
      dockerfile-path: src/dotnet/LogsIngestion/Dzaba.HomeSecurity.LogsIngestion.Service/Dockerfile

  devices-service:
    name: Devices service
    uses: ./.github/workflows/dotnet-service-ci.yml
    with:
      service-name: devices-service
      solution-path: src/dotnet/Devices/Dzaba.HomeSecurity.Devices.slnx
      dockerfile-path: src/dotnet/Devices/Dzaba.HomeSecurity.Devices.Service/Dockerfile

  logs-processor:
    name: Logs Processor (Go)
    uses: ./.github/workflows/go-service-ci.yml
    with:
      service-name: logs-processor
      module-path: src/go/LogsProcessor
      dockerfile-path: src/go/LogsProcessor/Dockerfile

  common-libraries:
    name: Common libraries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Common has no solution of its own; every *.Tests.csproj under it is
      # discovered, so new test projects are picked up without editing this file.
      # xargs runs all of them even if one fails, then exits non-zero.
      - name: Test
        run: find src/dotnet/Common -name '*.Tests.csproj' -print0 | xargs -0 -n1 dotnet test -c Release
