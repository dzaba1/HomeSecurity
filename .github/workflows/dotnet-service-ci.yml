name: .NET service CI (reusable)

on:
  workflow_call:
    inputs:
      service-name:
        description: Short name of the microservice, used for job/step labels and the built image tag.
        required: true
        type: string
      solution-path:
        description: Repo-relative path to the service's .slnx solution file.
        required: true
        type: string
      dockerfile-path:
        description: Repo-relative path to the service's Dockerfile.
        required: true
        type: string
      docker-context:
        description: Docker build context, relative to the repo root.
        required: false
        type: string
        default: .
      dotnet-version:
        description: .NET SDK version to install.
        required: false
        type: string
        default: 10.0.x
      configuration:
        description: Build configuration.
        required: false
        type: string
        default: Release

jobs:
  build-and-test:
    name: ${{ inputs.service-name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Restore
        run: dotnet restore "${{ inputs.solution-path }}"

      - name: Build
        run: dotnet build "${{ inputs.solution-path }}" --no-restore -c ${{ inputs.configuration }}

      - name: Test
        run: dotnet test "${{ inputs.solution-path }}" --no-build -c ${{ inputs.configuration }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.dockerfile-path }}
          push: false
          tags: ${{ inputs.service-name }}:ci
          cache-from: type=gha,scope=${{ inputs.service-name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service-name }}
