name: Go service CI (reusable)

on:
  workflow_call:
    inputs:
      service-name:
        description: Short name of the microservice, used for job/step labels and the built image tag.
        required: true
        type: string
      module-path:
        description: Repo-relative path to the service's Go module (the directory holding its go.mod).
        required: true
        type: string
      dockerfile-path:
        description: Repo-relative path to the service's Dockerfile.
        required: true
        type: string
      docker-context:
        description: Docker build context, relative to the repo root.
        required: false
        type: string
        default: .

jobs:
  build-and-test:
    name: ${{ inputs.service-name }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.module-path }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.module-path }}/go.mod
          cache-dependency-path: ${{ inputs.module-path }}/go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # The generated contract bindings are committed; fail if the schema and
      # the checked-in code have drifted apart.
      - name: Generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code -- .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.dockerfile-path }}
          push: false
          tags: ${{ inputs.service-name }}:ci
          cache-from: type=gha,scope=${{ inputs.service-name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service-name }}
